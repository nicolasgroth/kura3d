# Compilación Multiplataforma de Instaladores (Windows, Linux, macOS) — Kurra3D Studio
# Organización: ISGROTH — Innovación y Soluciones GROTH
# Autor: Nicolás Groth <ngroth@gmail.com>

name: Kurra3D Studio Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installers:
    name: Build Installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri v2 installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Kurra3D Studio v__VERSION__'
          releaseBody: 'Instaladores nativos de **Kurra3D Studio** (Windows `.msi`/`.exe`, Linux `.AppImage`/`.deb`, macOS `.dmg`) — ISGROTH (Innovación y Soluciones GROTH).'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
