# Integración Continua (CI) — Kura3D
# Organización: ISGROTH — Innovación y Soluciones GROTH
# Autor: Nicolás Groth <ngroth@gmail.com>

name: Kura3D CI

on:
  push:
    branches: [main]
    # Los cambios que son solo de documentación no gastan una corrida.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  pull_request:
    branches: [main]

# Un push nuevo cancela la corrida anterior de la misma rama: menos minutos y menos correos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-and-geometry:
    name: Web, TypeScript & Manifold Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # El typecheck del repositorio incluye el servidor MCP, que tiene sus propias dependencias.
      - name: Install MCP dependencies
        run: npm --prefix mcp-server ci

      - name: TypeScript typecheck
        run: npx tsc -b

      - name: Run unit & functional E2E tests
        run: npm test

      - name: Production Vite build
        run: npm run build

  mcp-server:
    name: MCP Server Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      # El servidor MCP compila el motor compartido de src/engine, que usa dependencias de la raíz.
      - name: Install root dependencies
        run: npm ci

      - name: Install MCP dependencies
        run: npm --prefix mcp-server ci

      - name: Build MCP server
        run: npm run mcp:build

      - name: Test MCP server
        run: npm run mcp:test

  tauri-rust-check:
    name: Tauri v2 Rust Check (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
