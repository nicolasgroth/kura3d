# Integración Continua (CI) — Kura3D
# Organización: ISGROTH — Innovación y Soluciones GROTH
# Autor: Nicolás Groth <ngroth@gmail.com>

name: Kura3D CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-and-geometry:
    name: Web, TypeScript & Manifold Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run unit & functional E2E tests
        run: npm test

      - name: Production Vite build
        run: npm run build

  mcp-server:
    name: MCP Server Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install MCP dependencies
        run: npm --prefix mcp-server ci

      - name: Build MCP server
        run: npm run mcp:build

      - name: Test MCP server
        run: npm run mcp:test

  tauri-rust-check:
    name: Tauri v2 Rust Check (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
