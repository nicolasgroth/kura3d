# Actualizaciones automáticas de dependencias — Kurra Studio (ISGROTH)
# Autor: Nicolás Groth <ngroth@gmail.com>
#
# Una vez al mes y agrupadas: un solo pull request por ecosistema en vez de uno por paquete.
# Las alertas de seguridad de GitHub siguen llegando aparte, sin esperar al mes.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      web:
        patterns: ["*"]
    # Los tipos de Node siguen a la versión de Node que usa el proyecto (22): no se sube de versión mayor por separado.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      mcp:
        patterns: ["*"]
    # Los tipos de Node siguen a la versión de Node que usa el proyecto (22): no se sube de versión mayor por separado.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      tauri:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
