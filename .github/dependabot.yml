# Actualizaciones automáticas de dependencias — Kurra3D Studio (ISGROTH)
# Autor: Nicolás Groth <ngroth@gmail.com>
#
# Una vez al mes y agrupadas: un solo pull request por ecosistema en vez de uno por paquete.
# Las alertas de seguridad de GitHub siguen llegando aparte, sin esperar al mes.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      mcp:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      tauri:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
