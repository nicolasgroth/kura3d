<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Esquema de color adaptable al sistema y sobreescribible sin FOUC -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const storedScheme = localStorage.getItem('kura3d-color-scheme');
        if (storedScheme === 'light' || storedScheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = storedScheme;
        }
      } catch (_err) {
        // Si el almacenamiento local está bloqueado, se mantiene la preferencia del sistema.
      }
    </script>
    <title>Kura3D — Estudio de Modelado 3D Nativo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
