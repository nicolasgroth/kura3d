# Autor: Nicolás Groth <ngroth@gmail.com>
# Organización: ISGROTH — Innovación y Soluciones GROTH
# Licencia: MIT
# Descripción: Manifiesto de Cargo para la aplicación nativa de escritorio Kura3D (Tauri v2).

[package]
name = "kura3d"
version = "0.5.0"
description = "Kura3D Native 3D Modeling Studio — ISGROTH (Innovación y Soluciones GROTH)"
authors = ["Nicolás Groth <ngroth@gmail.com>"]
repository = "https://github.com/nicolasgroth/kura3d"
license = "MIT"
edition = "2021"

# Configuración de librería para compatibilidad multiplataforma con Tauri v2
[lib]
name = "kura3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
keyring = "4"
