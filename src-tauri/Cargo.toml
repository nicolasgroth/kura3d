# Autor: Nicolás Groth <ngroth@gmail.com>
# Organización: ISGROTH — Innovación y Soluciones GROTH
# Licencia: MIT
# Descripción: Manifiesto de Cargo para la aplicación nativa de escritorio Kurra Studio (Tauri v2).

[package]
name = "kura3d"
version = "0.5.0"
description = "Kurra Studio — Native 3D Modeling Studio — ISGROTH (Innovación y Soluciones GROTH)"
authors = ["Nicolás Groth <ngroth@gmail.com>"]
repository = "https://github.com/nicolasgroth/kurra3d"
license = "MIT"
edition = "2021"

# Configuración de librería para compatibilidad multiplataforma con Tauri v2
[lib]
name = "kura3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
keyring = "4"
# Proxy nativo de proveedores IA (ai_proxy.rs): HTTP con rustls + ring, sin OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["sync", "macros", "time", "rt", "net"] }
url = "2"
